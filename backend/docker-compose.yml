services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs *.sql files in name order, only when the data volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
